[project]
name = "oh-my-bot"
version = "0.1.0"
description = "Telegram bot that forwards messages to a local LLM."
authors = [
    { name = "Pavel Yuruts", email = "pavel.yuruts@gmail.com" }
]
requires-python = ">=3.9"
dependencies = [
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
]

[project.scripts]
oh-my-bot = "oh_my_bot.main:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"


[tool.skylos]
# Analysis Settings
complexity = 10
nesting = 3
max_args = 5
max_lines = 50
ignore = []  # e.g. ["SKY-L002", "SKY-C304"]

[tool.skylos.gate]
# Gatekeeper Settings (skylos --gate)
fail_on_critical = true
max_security = 0
max_quality = 10
strict = false
